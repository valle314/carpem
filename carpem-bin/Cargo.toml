[package]
name = "carpem"
version = "0.1.0"
edition = "2024"
authors = ["my_name <my@email.com>"]

[dependencies]
ratatui = { version = "0.29.0", features = ["serde", "macros", "unstable-widget-ref"] }
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"
clap = { version = "4.5.20", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
config = "0.14.0"
crossterm = { version = "0.28.1", features = ["serde", "event-stream"] }
derive_deref = "1.1.1"
directories = "5.0.1"
futures = "0.3.31"
lazy_static = "1.5.0"
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.132"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }
toml = "0.8.20"
tui-big-text = "0.7.1"

carpem-core = { path = "../carpem-core/" }
date-parser = { path = "../date-parser/" }

chrono = "0.4.40"
tempfile = "3.19.0"
tui-input = "0.11.1"
anyhow = "1.0.98"
thiserror = "2.0.12"
itertools = "0.14.0"
